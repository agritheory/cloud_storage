[project]
name = "cloud_storage"
version = "16.0.0"
description = "Frappe App for integrating with cloud storage applications"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
	"boto3>=1.26.41",
	"botocore>=1.29.41",
	"python-magic>=0.4.27",
]
[[project.authors]]
name = "AgriTheory"
email = "support@agritheory.dev"

[build-system]
requires = [ "flit_core>=3.2,<4",]
build-backend = "flit_core.buildapi"

[tool.codespell]
skip = "CHANGELOG.md"

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version",]
version_variables = [ "cloud_storage/__init__.py:__version__",]
build_command = "echo 1"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.4.0"
pytest-cov = "~=6.0.0"
"moto[s3]" = "~=4.1.6"
Faker = "~=18.10.1"

[tool.pytest.ini_options]
addopts = "--cov=cloud_storage --cov-report term-missing"

[tool.semantic_release.branches.version-15]
match = "version-15"

[tool.semantic_release.branches.version-16]
match = "version-16"
