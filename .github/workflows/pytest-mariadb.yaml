name: Frappe CI - MariaDB

on:
  push:
    branches:
      - version-15
      - version-16
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_base-pytest.yml
    with:
      db: mariadb
      job-name: Server
